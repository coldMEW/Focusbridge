[package]
name = "focusbridge-secure-channel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["std", "default-resolver", "use-getrandom", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
