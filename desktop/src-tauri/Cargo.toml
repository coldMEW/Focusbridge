[package]
name = "focusbridge-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"

[lib]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.1"
rcgen = "0.12"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
pbkdf2 = "0.12"
hmac = "0.12"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
fs2 = "0.4"
zeroize = "1.8"
focusbridge-core = { path = "../core" }
# One shared Noise engine for Windows and Android; never a second port of it.
focusbridge-secure-channel = { path = "../../shared/secure-channel" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
open = "5.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
